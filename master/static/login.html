<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JENIX — Sign in</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#070b14; color:#e8f0fe; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .card { background:#0c1220; border:1px solid rgba(255,255,255,0.08); border-radius:14px;
          padding:36px; width:320px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { font-size:12px; color:rgba(122,143,166,0.7); margin:0 0 24px; }
  input { width:100%; box-sizing:border-box; background:#070b14; color:#e8f0fe;
          border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:10px;
          font-size:13px; margin-bottom:12px; }
  button { width:100%; padding:10px; border:none; border-radius:6px; background:#3b82f6;
           color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  button:hover { background:#2563eb; }
  #err { color:#f43f5e; font-size:12px; min-height:16px; margin-bottom:8px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>JENIX Control Plane</h1>
    <p class="sub">Sign in to continue</p>
    <div id="err"></div>
    <input type="text" id="username" placeholder="Username" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.detail || 'Login failed';
    }
  } catch (err) {
    errEl.textContent = 'Network error';
  }
});
</script>
</body>
</html>
