version: "3.9"

services:
  jenix-server:
    build: .
    container_name: jenix-server
    ports:
      - "8000:8000"
    volumes:
      - jenix-db:/app/jenix.db
      - jenix-reports:/app/reports
      - ./server/.env:/app/.env:ro
    env_file:
      - ./server/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: jenix-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jenix-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jenix-db:
  jenix-reports:
